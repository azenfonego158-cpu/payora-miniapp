<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101a35">

  <title>Payora</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Adsun SDK -->
  <script src="https://api.adsun.io/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 18px;
      font-family: Arial, sans-serif;
      background: #101a35;
      color: white;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: linear-gradient(135deg, #f5d77a, #b88624);
      color: #101a35;
      display: grid;
      place-items: center;
      font-size: 27px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .subtitle {
      color: #aab7d3;
      font-size: 13px;
      margin-top: 5px;
    }

    .balance {
      background: linear-gradient(135deg, #244b8d, #172b55);
      border: 1px solid #4568a0;
      padding: 24px;
      border-radius: 20px;
      margin-bottom: 22px;
    }

    .balance-label {
      color: #c5d3ed;
      font-size: 14px;
    }

    .amount {
      font-size: 34px;
      font-weight: bold;
      margin-top: 12px;
    }

    .coin {
      color: #f5d77a;
    }

    .section-title {
      font-size: 18px;
      margin: 24px 0 14px;
    }

    .task {
      background: #1c2948;
      padding: 17px;
      border-radius: 15px;
      margin-bottom: 12px;
    }

    .task-title {
      font-weight: bold;
    }

    .task-desc {
      color: #aab7d3;
      font-size: 13px;
      margin-top: 7px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 13px;
      background: #e7bd58;
      color: #17213a;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      background: #17213a;
      border: 1px solid #344667;
      border-radius: 12px;
      padding: 12px;
      margin-top: 14px;
      color: #c5d3ed;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .note {
      text-align: center;
      color: #8796b5;
      font-size: 12px;
      margin-top: 25px;
    }

    .test-label {
      display: inline-block;
      background: #493b1d;
      color: #f5d77a;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 11px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <div class="logo">P</div>

    <div>
      <h1>Payora</h1>
      <div class="subtitle">
        Your rewards journey starts here
      </div>
    </div>
  </div>

  <!-- BALANCE -->
  <div class="balance">
    <div class="balance-label">
      Your Balance
    </div>

    <div class="amount">
      <span class="coin">🪙</span>
      <span id="balanceAmount">Memuat saldo...</span>
    </div>

  <!-- EARN REWARDS -->
  <h2 class="section-title">
    Earn Rewards
  </h2>

  <div class="task">

    <div class="task-title">
      📺 Watch Advertisements
    </div>

    <div class="task-desc">
      Watch available advertisements and
      complete sponsored activities.
    </div>

    <button
      id="watchButton"
      onclick="watchAd()"
    >
      Start Earning
    </button>

    <div
      class="status"
      id="adStatus"
    >
      Menghubungkan ke server...
    </div>

  </div>

  <!-- DAILY REWARDS -->
  <div class="task">

    <div class="task-title">
      🎁 Daily Rewards
    </div>

    <div class="task-desc">
      Check back for new reward opportunities.
    </div>

    <button onclick="showMessage()">
      Coming Soon
    </button>

  </div>

  <div class="note">
    Payora © 2026
  </div>


  <!-- JAVASCRIPT -->
  <script>

    // =================================
    // TELEGRAM MINI APP
    // =================================

    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }


    // =================================
    // PAYORA API CONFIGURATION
    // =================================

    const API_URL =
      "https://payora-api.dad206887.workers.dev";


    // =================================
    // STATUS DISPLAY
    // =================================

    function updateStatus(message) {

      const status =
        document.getElementById("adStatus");

      status.textContent = message;

    }


    // =================================
    // ALERT
    // =================================

    function showAlert(message) {

      if (tg) {
        tg.showAlert(message);
      } else {
        alert(message);
      }

    }


    // =================================
    // LOAD USER BALANCE
    // =================================

    async function loadBalance() {

      const balanceElement =
        document.getElementById("balanceAmount");

      if (!tg || !tg.initData) {

        balanceElement.textContent =
          "Buka melalui Telegram";

        updateStatus(
          "Telegram initData tidak tersedia."
        );

        return;

      }

      updateStatus(
        "Menghubungkan ke Payora API..."
      );

      try {

        const response = await fetch(
          API_URL + "/api/balance",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              initData: tg.initData
            })
          }
        );


        // BACA RESPONS SERVER

        const responseText =
          await response.text();

        console.log(
          "Balance HTTP status:",
          response.status
        );

        console.log(
          "Balance response:",
          responseText
        );


        // PERIKSA FORMAT JSON

        let data;

        try {

          data = JSON.parse(responseText);

        } catch {

          throw new Error(
            "Server bukan JSON: " +
            responseText.substring(0, 150)
          );

        }


        // PERIKSA STATUS SERVER

        if (!response.ok || data.ok !== true) {

          throw new Error(
            "HTTP " +
            response.status +
            ": " +
            (data.error || "Permintaan gagal")
          );

        }


        // PERIKSA SALDO

        const coins = Number(data.coins);

        if (!Number.isFinite(coins)) {

          throw new Error(
            "Format saldo tidak valid."
          );

        }


        // TAMPILKAN SALDO

        balanceElement.textContent =
          coins.toLocaleString("id-ID") +
          " Coins";

        updateStatus(
          "Saldo berhasil dimuat dari server."
        );

        console.log(
          "Payora balance:",
          coins
        );


      } catch (error) {

        console.error(
          "Balance API error:",
          error
        );

        balanceElement.textContent =
          "Gagal memuat saldo";

        updateStatus(
          "Kesalahan saldo: " +
          error.message
        );

      }

    }


    // =================================
    // ADSUN CONFIGURATION
    // =================================

    let adController = null;

    const BLOCK_ID = "50201";

    const DEBUG_MODE = false;


    // =================================
    // INITIALIZE ADSUN
    // =================================

    function initializeAdsun() {

      try {

        if (!window.Adsun) {

          updateStatus(
            "Adsun SDK belum tersedia."
          );

          console.error(
            "Adsun SDK not loaded."
          );

          return;

        }


        adController = window.Adsun.init({

          blockId: BLOCK_ID,

          debug: DEBUG_MODE,

          debugConsole: true

        });


        // ADSUN EVENT LISTENERS

        const eventNames = [

          "onStart",
          "onSkip",
          "onReward",
          "onComplete",
          "onProgress",
          "onShowNextBanner",
          "onBannerNotFound",
          "onNonStopShow",
          "onTooLongSession",
          "onNotSuitable",
          "onError"

        ];


        eventNames.forEach((name) => {

          adController.addEventListener(
            name,
            (data) => {

              console.log(
                "[Adsun Event]",
                name,
                data
              );

              updateStatus(
                "Adsun Event: " + name
              );

            }
          );

        });


        updateStatus(
          "Adsun siap untuk pengujian."
        );

        console.log(
          "Adsun initialized successfully."
        );


      } catch (error) {

        console.error(
          "Adsun initialization error:",
          error
        );

        updateStatus(
          "Gagal menginisialisasi Adsun."
        );

      }

    }


    // =================================
    // WATCH ADVERTISEMENT
    // =================================

    async function watchAd() {

      const button =
        document.getElementById("watchButton");


      if (!adController) {

        showAlert(
          "Adsun belum siap. Periksa koneksi dan coba lagi."
        );

        return;

      }


      button.disabled = true;

      button.textContent =
        "Loading Advertisement...";


      updateStatus(
        "Meminta iklan dari Adsun..."
      );


      try {

        const result =
          await adController.show();


        console.log(
          "[Adsun Result]",
          result
        );


        if (result?.done === true) {

          updateStatus(
            "Iklan percobaan selesai."
          );

          showAlert(
            "Iklan percobaan selesai. Saldo belum otomatis bertambah dalam mode pengujian."
          );

        } else {

          updateStatus(
            "Proses iklan selesai. Periksa hasil pengujian."
          );

          showAlert(
            "Proses iklan telah selesai."
          );

        }


        // AMBIL ULANG SALDO DARI SERVER

        await loadBalance();


      } catch (error) {

        console.error(
          "[Adsun Error]",
          error
        );

        updateStatus(
          "Iklan tidak tersedia atau terjadi kesalahan."
        );

        showAlert(
          "Iklan tidak tersedia atau terjadi kesalahan."
        );


      } finally {

        button.disabled = false;

        button.textContent =
          "Start Earning";

      }

    }


    // =================================
    // DAILY REWARDS PLACEHOLDER
    // =================================

    function showMessage() {

      showAlert(
        "Fitur sedang dalam tahap pengujian."
      );

    }


    // =================================
    // START APPLICATION
    // =================================

    window.addEventListener(
      "load",
      () => {

        loadBalance();

        initializeAdsun();

      }
    );

  </script>

</body>
</html>
